<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dane County Board Elections 2026</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="title-bar">
    <h1>Dane County Board Elections 2026</h1>
  </div>
  <div id="controls-bar">
    <label>
      <input type="checkbox" id="shadeDistricts" checked>
      Shade districts
    </label>
    <label>
      <input type="checkbox" id="showAlders">
      Show alder districts
    </label>
  </div>
  <div id="map"></div>
  <div id="help-link">
    <a href="#" id="helpBtn">Help/About</a>
  </div>
  <div id="helpModal" class="modal" style="display:none;">
    <div class="modal-content">
      <span class="close" id="helpModalClose">&times;</span>
      <div class="modal-text">
        <h3>About This Site</h3>
        <p>Site by Erik Paulson.</p>
        <p>Alder labels appear when zoomed in, click on an alder name to see their district flash.</p>
        <p>Get the source at <a href="https://github.com/epaulson/2026-county-board-elections" target="_blank" rel="noopener noreferrer">github.com/epaulson/2026-county-board-elections</a></p>
      </div>
    </div>
  </div>
  <script type="module" src="/main.js"></script>
</body>
</html>
